<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동영상 업로드 프로그램 — 화면 설계안</title>
  <style>
    :root{--ink:#131628;--paper:#f5f5f0;--muted:#7c7f8a;--line:#dedfd8;--lime:#d8f66a;--coral:#ff8c73}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}.frame{min-height:100vh;display:flex}.rail{width:235px;background:var(--ink);color:#fff;padding:30px 24px}.logo{font-weight:800;font-size:19px;line-height:.9}.logo small{display:block;color:#7d8296;font-size:9px;font-weight:400;margin-top:10px}.mark{display:flex;gap:3px;align-items:end;height:28px;margin-bottom:12px}.mark i{width:7px;background:var(--lime);height:12px}.mark i:nth-child(2){height:19px;background:var(--coral)}.mark i:nth-child(3){height:26px}.nav{margin-top:66px;color:#9195a7;font-size:12px}.nav div{padding:12px;border-radius:6px;margin:4px 0}.nav .active{background:var(--lime);color:var(--ink)}.content{flex:1;padding:46px 6vw;max-width:1200px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:34px}.eyebrow,.kicker{font:10px monospace;color:#8b8d96;letter-spacing:.08em}.top h1{font-size:30px;margin:10px 0 0;letter-spacing:-.06em}.status{font:10px monospace;color:#6c7080}.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:7vw;align-items:center;padding:60px 0}.hero h2{font-size:50px;line-height:1.05;letter-spacing:-.08em;margin:12px 0 20px}.hero h2 span{color:#8a8d98}.hero p{font-size:13px;line-height:1.8;color:var(--muted);max-width:335px}.formats{font:10px monospace;color:#898b96;margin-top:25px}.drop{height:330px;border:1px dashed #adb0aa;border-radius:14px;display:grid;place-items:center;background:#efefe9}.drop-inner{text-align:center}.circle{width:72px;height:72px;border-radius:50%;border:1px solid #bfc1b8;box-shadow:0 0 0 9px #e7e7df;margin:auto;display:grid;place-items:center;font-size:27px}.drop strong{display:block;margin:19px 0 9px;font-size:16px}.drop span{display:block;color:#9698a0;font-size:11px}.button{border:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:5px;margin-top:12px;font-weight:700}.library{border-top:1px solid var(--line);padding-top:30px}.library h2{font-size:21px;letter-spacing:-.06em}.empty{border:1px solid var(--line);height:200px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:8px}
  </style>
</head>
<body>
  <!-- 업로드 센터의 개발 전 화면 구조를 확인하기 위한 HTML 설계안 -->
  <div class="frame"><aside class="rail"><div class="mark"><i></i><i></i><i></i></div><div class="logo">UPLOAD<br>DESK<small>동영상 업로드 프로그램</small></div><div class="nav"><div class="active">↗ &nbsp; 업로드</div><div>▤ &nbsp; 내 동영상</div></div></aside><main class="content"><header class="top"><div><span class="eyebrow">MEDIA WORKSPACE / 01</span><h1>업로드 센터</h1></div><span class="status">● 로컬 서버 연결됨</span></header><section class="hero"><div><span class="kicker">DROP ZONE</span><h2>영상을 올리고<br><span>바로 정리하세요.</span></h2><p>촬영본, 편집본, 검수용 프리뷰를 한 곳에 보관합니다. 파일을 끌어놓거나 선택해 주세요.</p><div class="formats">MP4 &nbsp; MOV &nbsp; WebM &nbsp; MKV &nbsp; / &nbsp; 최대 2 GB</div></div><div class="drop"><div class="drop-inner"><div class="circle">↥</div><strong>파일을 여기에 놓으세요</strong><span>또는</span><button class="button">동영상 선택</button></div></div></section><section class="library"><span class="kicker">YOUR LIBRARY</span><h2>내 동영상 <small>0</small></h2><div class="empty"><div><b>아직 업로드한 영상이 없습니다.</b>첫 영상을 올리면 이곳에서 파일 상태와 정보를 확인할 수 있어요.</div></div></section></main></div>
</body>
</html>
